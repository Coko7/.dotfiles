####################
### KEY BINDINGS ###
####################

# Use current path when creating a new window or splitting
unbind c
bind t new-window      -c "#{pane_current_path}"
bind q split-window -h -c "#{pane_current_path}"
bind a split-window -v -c "#{pane_current_path}"

# Unbind " and % which to force me to split panes using the new mappings
unbind '"'
unbind %

# Pane resize (arrows)
bind -r C-Left  resize-pane -L 5
bind -r C-Down  resize-pane -D 5
bind -r C-Up    resize-pane -U 5
bind -r C-Right resize-pane -R 5

# Smart pane switching with awareness of Vim splits (Ctrl + Arrow version)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# IMPORTANT: make tmux understand modified arrows
set -g xterm-keys on

# Ctrl + Arrow bindings
bind-key -n C-Left  if-shell "$is_vim" "send-keys C-Left"  "select-pane -L"
bind-key -n C-Right if-shell "$is_vim" "send-keys C-Right" "select-pane -R"
bind-key -n C-Up    if-shell "$is_vim" "send-keys C-Up"    "select-pane -U"
bind-key -n C-Down  if-shell "$is_vim" "send-keys C-Down"  "select-pane -D"

# Optional: last pane (like C-\)
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Copy mode (use plain arrows here, not Ctrl+Arrow)
bind-key -T copy-mode-vi Left  select-pane -L
bind-key -T copy-mode-vi Right select-pane -R
bind-key -T copy-mode-vi Up    select-pane -U
bind-key -T copy-mode-vi Down  select-pane -D

bind -r ^ last-window

# Ubind original vim keybindings
unbind -T copy-mode-vi Space; #Default for begin-selection
unbind -T copy-mode-vi Enter; #Default for copy-selection

# Vim copy mode (v and y)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"`

# fzf-powered tmux window/session/pane navigation
# bind-key -r f run-shell "tmux neww $XDG_CONFIG_HOME/scripts/tmux/tmux-sessionizer.sh"
# bind-key -r F run-shell "tmux neww $XDG_CONFIG_HOME/scripts/tmux/tmux-windowizer.sh"
bind-key -r s run-shell "$SCRIPTS/tmux/switch-client.sh"

# Run cheat.sh (cht.sh) in new window
# bind-key -r i run-shell "tmux neww $XDG_CONFIG_HOME/scripts/cheat-sh/cht.sh"

bind-key -r h run-shell -b "$SCRIPTS/tmux/oskour/oskour.sh"
bind-key -r f run-shell "$SCRIPTS/tmux/fzf-window.sh"
bind-key -r T run-shell "$SCRIPTS/tmux/zoxide-new-window.sh"

bind-key X confirm-before -p "KS #S (y/n)?" "run-shell 'tmux switch-client -n \\\; kill-session -t \"#S\"'"
